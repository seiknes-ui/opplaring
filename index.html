<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opplæring</title>
<style>
:root{--bg:#E9EDF1;--fg:#14213A;--muted:#566275;--line:#CBD3DD;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--fg:#E5EAF2;--muted:#9BA7B9;--line:#2B3852;--card:#161F30;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 4px}p{color:var(--muted);margin:0 0 24px}
a.card{display:block;padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--fg)}a.card b{font-size:18px}a.card span{display:block;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Opplæring</h1>
<p>Digitale undervisningsopplegg for transport og logistikk.</p>
<a class="card" href="fraktvekt-labben/"><b>Fraktvekt-labben</b><span>Utforsk omregningsfaktor på gods: faktisk vekt, volumvekt og lastemeter. Med oppdrag som eleven leverer inn.</span></a>
</main>
</body>
</html>
